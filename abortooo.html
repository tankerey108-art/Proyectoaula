<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recopilación de Experiencias Finales - Proyecto Aula</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Sección de la galería */
        .seccion-galeria {
            background-color: #333; /* Color de fondo de la sección */
            padding: 40px 20px;
        }

        .titulo-galeria {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }

        .galeria {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .galeria img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .galeria img:hover {
            transform: scale(1.05);
        }
/* --- ESTILOS DEL NUEVO CUADRO DE ENLACES --- */
        .panel-enlaces {
            background-color: var(--bg-tarjeta);
            border-radius: 12px;
            padding: 1.5rem 2rem;
            box-shadow: var(--sombra);
            border: 1px solid var(--color-borde);
            margin-bottom: 2.5rem;
        }

        .panel-enlaces h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
        }

        .panel-enlaces h3::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--color-acento);
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .lista-enlaces {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            list-style: none;
        }

        .enlace-documento {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            background-color: var(--color-cita-bg);
            border: 1px solid var(--color-borde);
            border-radius: 8px;
            color: var(--texto-primario);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .enlace-documento:hover {
            border-color: var(--color-acento);
            background-color: #ffffff;
            color: var(--color-acento);
            transform: translateX(2px);
        }
/* --- ESTILOS PARA IMÁGENES Y ENLACES --- */
        .imagen-materia {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            border: 1px solid var(--color-borde);
            background-color: #e2e8f0; 
        }

        .enlace-proyecto {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: 0.6rem 1.2rem;
            background-color: transparent;
            color: var(--color-acento);
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 2px solid var(--color-acento);
            transition: all 0.2s ease;
            text-align: center;
        }

        .enlace-proyecto:hover {
            background-color: var(--color-acento);
            color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        :root {
            --bg-principal: #f4f6f9;
            --bg-tarjeta: #ffffff;
            --texto-primario: #1e293b;
            --texto-secundario: #64748b;
            --color-acento: #2563eb;
            --color-cita-bg: #f8fafc;
            --color-borde: #e2e8f0;
            --sombra: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --sombra-hover: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-primario);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .contenedor {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--color-borde);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #0f172a;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .subtitulo {
            font-size: 1.1rem;
            color: var(--texto-secundario);
            font-weight: 400;
        }

        .grid-experiencias {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .tarjeta-materia {
            background-color: var(--bg-tarjeta);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--sombra);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid var(--color-borde);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tarjeta-materia:hover {
            transform: translateY(-4px);
            box-shadow: var(--sombra-hover);
        }

        .materia-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        .materia-indicador {
            width: 4px;
            height: 24px;
            background-color: var(--color-acento);
            border-radius: 2px;
            margin-right: 0.75rem;
        }

        h2 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #0f172a;
        }

        .descripcion {
            color: var(--texto-primario);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            text-align: justify;
        }

        .bloque-experiencia {
            background-color: var(--color-cita-bg);
            border-left: 4px solid var(--color-acento);
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            margin-top: auto;
        }

        .pregunta {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--color-acento);
            letter-spacing: 0.025em;
            margin-bottom: 0.5rem;
        }

        .respuesta {
            font-style: italic;
            color: #334155;
            font-size: 0.95rem;
        }

        .tarjeta-materia:nth-child(1) { --color-acento: #3b82f6; } 
        .tarjeta-materia:nth-child(2) { --color-acento: #ec4899; } 
        .tarjeta-materia:nth-child(3) { --color-acento: #10b981; } 
        .tarjeta-materia:nth-child(4) { --color-acento: #f59e0b; } 
        .tarjeta-materia:nth-child(5) { --color-acento: #6366f1; } 
        .tarjeta-materia:nth-child(6) { --color-acento: #8b5cf6; } 
        .tarjeta-materia:nth-child(7) { --color-acento: #14b8a6; } 
        .tarjeta-materia:nth-child(8) { --color-acento: #f43f5e; } 
        .tarjeta-materia:nth-child(9) { --color-acento: #64748b; } 

        @media (max-width: 480px) {
            body {
                padding: 1rem 0.5rem;
            }
            h1 {
                font-size: 1.8rem;
            }
            .grid-experiencias {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <header>
            <h1>Recopilación de Trabajos finales.</h1>
        </header>
<section class="panel-enlaces">
            <h3>RESULTADOS DE ENCUESTAS</h3>
            <ul class="lista-enlaces">
                <li><a href="ENCUESTA 1.pdf" class="enlace-documento" target="_blank">Encuesta 1</a></li>
                <li><a href="ENCUESTA 2.pdf" class="enlace-documento" target="_blank">Encuesta 2</a></li>
                <li><a href="encueta 3.pdf" class="enlace-documento" target="_blank"> Encuesta 3</a></li>
               
            </ul>
        </section>

        <main class="grid-experiencias">

            <article class="tarjeta-materia">
                <div>
<img src="1000027029.jpg" alt="Foto de Orientación" class="imagen-materia">
                    <div class="materia-header">
                        <div class="materia-indicador"></div>
                        <h2>Cuento</h2>
                    </div>
                    <p class="descripcion"><a href="Copia de DE LA TRANQUILIDAD A LA DESCONFIANZA.pdf" download="CUENTO.pdf" class="enlace-documento"> DE LA TRANQUILIDAD A LA DESCONFIANZA.pdf</a>
                </div>
            </article>

            <article class="tarjeta-materia">
                <div>
<img src="1000027027.jpg" alt="Foto de Orientación" class="imagen-materia">
                    <div class="materia-header">
                        <div class="materia-indicador"></div>
                        <h2>Video</h2>
                    </div>
                    <p class="descripcion">  <p class="descripcion"><a href="Danna y Lilly.mp4" download="Video" class="enlace-documento"> Danna y Lilly</a></p>
                </div>
            </article>
            <section class="seccion-galeria">
            <div class="galeria">
                <h2 class="titulo-galeria">Fotos del proyecto.</h2>
        <img src="1000027006 (1).jpg" alt="Foto 1">
        <img src="1000027012.jpg" alt="Foto 2">
        <img src="1000027015.jpg" alt="Foto 3">
        <img src="1000027017.jpg" alt="Foto 4">
        <img src="1000027022.jpg" alt="Foto 5">
    </div>

        </main>
    </div>
    

</body>
</html>
